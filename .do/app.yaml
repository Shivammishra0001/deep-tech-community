# DigitalOcean App Platform spec.
#
# SECRETS ARE DELIBERATELY NOT STORED IN THIS FILE.
# This manifest is committed to version control, so it must never contain
# credential values. The variables listed under "Required secrets" below are
# configured out-of-band, as App-Level Environment Variables:
#
#   DigitalOcean control panel → Apps → deep-tech-community → Settings →
#   App-Level Environment Variables → Edit → add each key, tick "Encrypt".
#
#   or:  doctl apps update <app-id> --env "JWT_SECRET=..." (value not echoed to shell history)
#
# Required secrets (all must be set for the app to boot correctly):
#   GOOGLE_SERVICE_ACCOUNT_EMAIL   service account address for the Sheets/Drive integration
#   GOOGLE_PRIVATE_KEY             matching PEM private key (newlines escaped as \n)
#   GOOGLE_SHEETS_SPREADSHEET_ID   target spreadsheet id
#   JWT_SECRET                     >= 32 chars; openssl rand -base64 48
#   REFRESH_TOKEN_SECRET           >= 32 chars; openssl rand -base64 48
#
# NOTE: because these are not declared here, applying this spec wholesale
# (`doctl apps update --spec .do/app.yaml`) will not remove them, but neither
# will it create them on a fresh app — set them in the control panel first.

name: deep-tech-community
region: blr
services:
- name: web
  github:
    branch: main
    deploy_on_push: true
    repo: Shivammishra0001/deep-tech-community
  build_command: npm run build
  run_command: npm run start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 3000
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "3000"
